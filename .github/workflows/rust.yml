name: CI

on: [push, pull_request]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README tables
        run: script/check-readme
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Plain `cargo check` compiles neither the benches nor the examples.
      - name: Clippy, all benches and examples
        run: cargo clippy --all-targets --features encodings -- -D warnings
