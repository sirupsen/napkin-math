[package]
name = "napkin-math"
version = "0.1.0"
authors = ["Simon Eskildsen <sirup@sirupsen.com>"]
edition = "2021"

[profile.release]
debug = true
overflow-checks = false

# Only examples/compression_ratio uses these, behind the `encodings` feature (dev-dependencies
# can't be optional, and they would slow every `cargo bench` build).
[dependencies]
alp = { version = "0.0.4", optional = true }
arrow-array = { version = "60", optional = true }
bitpacking = { version = "0.9", optional = true }
bytes = { version = "1", optional = true }
fastlanes = { version = "0.6", optional = true }
fsst-rs = { version = "0.6", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
roaring = { version = "0.11", optional = true }
casefold = { version = "0.1", optional = true }
sparse-ngrams = { version = "0.4", optional = true }
rustc-hash = { version = "2", optional = true }

[features]
encodings = ["dep:alp", "dep:arrow-array", "dep:bitpacking", "dep:bytes", "dep:fastlanes", "dep:fsst-rs", "dep:parquet", "dep:roaring", "dep:casefold", "dep:sparse-ngrams", "dep:rustc-hash"]

[dev-dependencies]
bitpacking = "0.9"
blake3 = "1"
brotli = "9"
core_affinity = "0.8"
crc32fast = "1"
criterion = "0.8"
flate2 = "1"
libc = "0.2"
lz4 = "1"
# The default safe-encode/safe-decode features add bounds checks the C library doesn't have.
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
postcard = { version = "1", features = ["alloc"] }
prost = "0.14"
rand = "0.10"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snap = "1"
tikv-jemallocator = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"

[target.'cfg(target_os = "linux")'.dev-dependencies]
io-uring = "0.7"

[[bench]]
name = "napkin_math"
harness = false

# The standalone tools in examples/ take arguments (paths, devices, a server address) and print
# their usage without them: cargo run --release --example storage -- <args>.

[[example]]
name = "compression_ratio"
required-features = ["encodings"]
