[package]
name = "napkin-math"
version = "0.1.0"
authors = ["Simon Eskildsen <sirup@sirupsen.com>"]
edition = "2021"

[profile.release]
debug = true
overflow-checks = false

# Used by src/bin/compression_corpus.rs.
[dependencies]
brotli = "9"
flate2 = "1"
lz4_flex = "0.14"
snap = "1"
zstd = "0.14"

[dev-dependencies]
bitpacking = "0.9"
blake3 = "1"
core_affinity = "0.8"
crc32fast = "1"
criterion = "0.8"
libc = "0.2"
prost = "0.14"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tikv-jemallocator = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[bench]]
name = "napkin_math"
harness = false
