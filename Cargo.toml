[package]
name = "napkin-math"
version = "0.1.0"
authors = ["Simon Eskildsen <sirup@sirupsen.com>"]
edition = "2021"

[profile.release]
debug = true
overflow-checks = false

# Used by src/bin/compression_corpus.rs.
[dependencies]
brotli = "9"
flate2 = "1"
lz4_flex = "0.14"
snap = "1"
zstd = "0.14"
# Used by src/bin/encoding_ratio.rs, behind the `encodings` feature.
arrow-array = { version = "60", optional = true }
bitpacking = { version = "0.9", optional = true }
bytes = { version = "1", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
roaring = { version = "0.11", optional = true }

[features]
encodings = ["dep:arrow-array", "dep:bitpacking", "dep:bytes", "dep:parquet", "dep:roaring"]

[[bin]]
name = "encoding_ratio"
required-features = ["encodings"]

[dev-dependencies]
bitpacking = "0.9"
blake3 = "1"
core_affinity = "0.8"
crc32fast = "1"
criterion = "0.8"
libc = "0.2"
postcard = { version = "1", features = ["alloc"] }
prost = "0.14"
rand = "0.10"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tikv-jemallocator = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[bench]]
name = "napkin_math"
harness = false
