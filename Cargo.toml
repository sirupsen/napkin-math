[package]
name = "napkin-math"
version = "0.1.0"
authors = ["Simon Eskildsen <sirup@sirupsen.com>"]
edition = "2021"

[profile.release]
debug = true
overflow-checks = false

# Used by benches/cpu_compress.rs.
[dependencies]
brotli = "9"
flate2 = "1"
lz4_flex = "0.14"
snap = "1"
zstd = "0.14"
# Used by benches/compression_ratio.rs and compression_ratio_columns.rs, behind the
# `encodings` feature.
alp = { version = "0.0.4", optional = true }
arrow-array = { version = "60", optional = true }
bitpacking = { version = "0.9", optional = true }
bytes = { version = "1", optional = true }
fastlanes = { version = "0.6", optional = true }
fsst-rs = { version = "0.6", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
roaring = { version = "0.11", optional = true }

[features]
encodings = ["dep:alp", "dep:arrow-array", "dep:bitpacking", "dep:bytes", "dep:fastlanes", "dep:fsst-rs", "dep:parquet", "dep:roaring"]

[dev-dependencies]
blake3 = "1"
core_affinity = "0.8"
crc32fast = "1"
criterion = "0.8"
libc = "0.2"
postcard = { version = "1", features = ["alloc"] }
prost = "0.14"
rand = "0.10"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tikv-jemallocator = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[bench]]
name = "napkin_math"
harness = false

# Standalone tools that take arguments (paths, devices, a server address).
# `bench = false` keeps plain `cargo bench` and its filters to napkin_math;
# run a tool by name: cargo bench --bench storage -- <args>.

[[bench]]
name = "cpu_compress"
harness = false
bench = false

[[bench]]
name = "storage"
harness = false
bench = false

[[bench]]
name = "storage_durable_write"
harness = false
bench = false

[[bench]]
name = "network"
harness = false
bench = false

[[bench]]
name = "compression_ratio"
harness = false
bench = false
required-features = ["encodings"]

[[bench]]
name = "compression_ratio_columns"
harness = false
bench = false
required-features = ["encodings"]
